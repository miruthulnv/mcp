services:
  notes-mcp:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-your-github-username}/notes-mcp:latest
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - notes_data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  notes_data:
