[project]
name = "notes-mcp"
version = "0.1.0"
description = "Notes MCP Server storing personal notes in SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "uvicorn",
    "starlette",
]

[project.scripts]
notes-mcp = "notes_mcp.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
